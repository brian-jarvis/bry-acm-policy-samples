      '3_0':
        kind: Panel
        spec:
          display:
            name: 'OpenShift minors: current phase'
            description: Every supported OpenShift minor, plus any minor a cluster is running or targeting.
          plugin:
            kind: Table
            spec:
              columnSettings:
              - header: Minor
                name: 'ocp_version #1'
              - hide: true
                name: 'ocp_version #2'
              - cellSettings:
                - backgroundColor: '#73bf69'
                  condition:
                    kind: Value
                    spec:
                      value: '3'
                  text: Full support
                - backgroundColor: '#5794f2'
                  condition:
                    kind: Value
                    spec:
                      value: '2'
                  text: Maintenance
                - backgroundColor: '#ff9830'
                  condition:
                    kind: Value
                    spec:
                      value: '1'
                  text: Extended (EUS)
                - backgroundColor: '#f2495c'
                  condition:
                    kind: Value
                    spec:
                      value: '0'
                  text: End of life
                - condition:
                    kind: Value
                    spec:
                      value: '-1'
                  text: Unknown
                header: Support level
                name: 'value #1'
              - header: Phase
                name: 'phase #1'
              - format:
                  unit: date-iso
                header: Standard support ends
                name: 'value #2'
              - hide: true
                name: timestamp
              density: compact
              transforms:
              - kind: JoinByColumnValue
                spec:
                  columns:
                  - 'ocp_version #1'
                  - 'ocp_version #2'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max by (ocp_version, phase) (ocp_lifecycle_ocp_version_support_phase{cluster=~"$cluster"})
                  seriesNameFormat: ''
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: (max by (ocp_version) (ocp_lifecycle_ocp_version_support_end_timestamp_seconds{cluster=~"$cluster"}) + 43200) * 1000
                  seriesNameFormat: ''
      '3_1':
        kind: Panel
        spec:
          display:
            name: 'OpenShift minors: phase end dates'
            description: Published end date of each lifecycle phase. Empty where the phase does not apply (e.g. EUS on odd minors).
          plugin:
            kind: Table
            spec:
              columnSettings:
              - header: Minor
                name: 'ocp_version #1'
              - hide: true
                name: 'ocp_version #2'
              - hide: true
                name: 'ocp_version #3'
              - hide: true
                name: 'ocp_version #4'
              - hide: true
                name: 'ocp_version #5'
              - hide: true
                name: 'ocp_version #6'
              - format:
                  unit: date-iso
                header: Full support
                name: 'value #1'
              - format:
                  unit: date-iso
                header: Maintenance support
                name: 'value #2'
              - format:
                  unit: date-iso
                header: Extended update support
                name: 'value #3'
              - format:
                  unit: date-iso
                header: Extended update support Term 2
                name: 'value #4'
              - format:
                  unit: date-iso
                header: Extended update support Term 3
                name: 'value #5'
              - format:
                  unit: date-iso
                header: Extended life phase
                name: 'value #6'
              - hide: true
                name: timestamp
              density: compact
              transforms:
              - kind: JoinByColumnValue
                spec:
                  columns:
                  - 'ocp_version #1'
                  - 'ocp_version #2'
                  - 'ocp_version #3'
                  - 'ocp_version #4'
                  - 'ocp_version #5'
                  - 'ocp_version #6'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: (max by (ocp_version) (ocp_lifecycle_ocp_version_phase_end_timestamp_seconds{cluster=~"$cluster", phase="Full support"}) + 43200) * 1000
                  seriesNameFormat: ''
          - kind: TimeSeriesQuery
            spec:
              plugin:
