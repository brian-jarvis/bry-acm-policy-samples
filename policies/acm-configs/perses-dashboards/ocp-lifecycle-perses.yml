      '4_0':
        kind: Panel
        spec:
          display:
            name: Lifecycle data age
            description: Oldest successful Red Hat API fetch across the selected clusters. Refreshes every 4h.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max(time() - ocp_lifecycle_api_last_success_timestamp_seconds{cluster=~"$cluster"})
                  seriesNameFormat: ''
      '4_1':
        kind: Panel
        spec:
          display:
            name: Cluster data age
            description: Oldest successful read of ClusterVersion/Subscriptions. Refreshes every 10m.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max(time() - ocp_lifecycle_cluster_last_success_timestamp_seconds{cluster=~"$cluster"})
                  seriesNameFormat: ''
      '4_2':
        kind: Panel
        spec:
          display:
            name: Clusters with stale data
            description: Clusters whose exporter has not reached access.redhat.com in 24h.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: background_solid
              format:
                unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count((time() - ocp_lifecycle_api_last_success_timestamp_seconds{cluster=~"$cluster"}) > 86400)
                  seriesNameFormat: ''
