                    name: rbac-query-proxy-datasource
                  query: (max by (ocp_version) (ocp_lifecycle_ocp_version_phase_end_timestamp_seconds{cluster=~"$cluster", phase="Extended update support Term 2"}) + 43200) * 1000
                  seriesNameFormat: ''
