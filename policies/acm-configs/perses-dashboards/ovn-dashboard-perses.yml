---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  namespace: open-cluster-management-observability
  name: ovn-dashboard
  labels:
    managed-by: bry-tam-policies
spec:
  config:
    display:
      name: Openshift Networking
    variables:
    - kind: ListVariable
      spec:
        display:
          name: Master
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: node
            matchers:
            - kube_node_role{role="master"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: _master_node
    - kind: ListVariable
      spec:
        display:
          name: Worker
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: node
            matchers:
            - kube_node_role{role=~"work.*"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: _worker_node
    - kind: ListVariable
      spec:
        display:
          name: OVNKube-Controlplane
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
            - '{pod=~"ovnkube-control-plane.*", namespace=~"openshift-ovn-kubernetes"}'
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: controlplane_pod
    - kind: ListVariable
      spec:
        display:
          name: OVNKube-Node
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
            - '{pod=~"ovnkube-node.*", namespace=~"openshift-ovn-kubernetes"}'
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: kubenode_pod
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: OVNKube Cluster Manager Leader
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              format:
                unit: decimal
              metricLabel: pod
              sparkline: {}
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#ff9830'
                  value: 0
                - color: '#73bf69'
                  value: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: ovnkube_clustermanager_leader > 0
                  seriesNameFormat: '{{pod}}'
      '0_1':
        kind: Panel
        spec:
          display:
            name: OVN Northd Status
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              format:
                unit: decimal
              metricLabel: pod
              sparkline: {}
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#ff9830'
                  value: 0
                - color: '#73bf69'
                  value: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: ovn_northd_status
                  seriesNameFormat: '{{pod}}'
      '0_2':
        kind: Panel
        spec:
          display:
            name: OVN Controller Count
          plugin:
            kind: StatChart
            spec:
              calculation: last
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(ovn_controller_monitor_all) by (namespace)
                  seriesNameFormat: ''
      '0_3':
        kind: Panel
        spec:
          display:
            name: OVNKube Control Plane CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( irate(container_cpu_usage_seconds_total{pod=~"(ovnkube-master|ovnkube-control-plane).+",namespace="openshift-ovn-kubernetes",container!~"POD|"}[2m])*100 ) by (pod, node)
                  seriesNameFormat: '{{pod}} - {{node}}'
