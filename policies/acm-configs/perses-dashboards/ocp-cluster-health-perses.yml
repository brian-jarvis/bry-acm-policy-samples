---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  namespace: open-cluster-management-observability
  name: ocp-cluster-health
  labels:
    managed-by: bry-tam-policies
spec:
  config:
    display:
      name: bry-tam / OpenShift Cluster Health
    variables:
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: cluster
        name: cluster
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
            labelName: name
            matchers:
            - acm_managed_cluster_labels{openshiftVersion_major!="3"}
    - kind: ListVariable
      spec:
        display:
          name: interval
          hidden: false
        defaultValue: 10m
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - 1m
            - 3m
            - 5m
            - 10m
            - 20m
            - 30m
        name: interval
    panels:
      overview_alerts_stat:
        kind: Panel
        spec:
          display:
            name: Firing alerts by severity
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#ff9830'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (severity) (ALERTS{cluster="$cluster",alertstate="firing",alertname!="Watchdog",severity!="none"})
                  seriesNameFormat: '{{severity}}'
      overview_summary:
        kind: Panel
        spec:
          display:
            name: Cluster summary
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - header: Resource
                name: resource
                sort: asc
                width: 200
              - header: State
                name: state
                sort: asc
                width: 240
              - header: Count
                name: value
                width: 120
                align: right
              - hide: true
                name: condition
              - hide: true
                name: phase
              - hide: true
                name: timestamp
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: |-
                    label_replace(label_replace(sum(kube_node_info{cluster="$cluster"}), "resource", "Nodes", "", ""), "state", "Total", "", "")
                    or
                    label_replace(label_replace(sum by (condition) (kube_node_status_condition{cluster="$cluster",status="true"}) > 0, "resource", "Nodes", "", ""), "state", "$1", "condition", "(.*)")
                    or
                    label_replace(label_replace(sum by (phase) (kube_namespace_status_phase{cluster="$cluster"}), "resource", "Namespaces", "", ""), "state", "$1", "phase", "(.*)")
                    or
                    label_replace(label_replace(sum by (phase) (kube_pod_status_phase{cluster="$cluster"}) > 0, "resource", "Pods", "", ""), "state", "$1", "phase", "(.*)")
      overview_alerts:
        kind: Panel
        spec:
          display:
            name: Top 10 firing alerts
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10,sum(ALERTS{cluster="$cluster",severity!="none"}) by (alertname, severity))
                  seriesNameFormat: '{{severity}}: {{alertname}}'
      operators_total:
        kind: Panel
        spec:
          display:
            name: Operators
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: background_solid
              format:
                unit: decimal
              thresholds:
                defaultColor: '#5794f2'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(count by (name) (cluster_operator_conditions{cluster="$cluster"}))
                  seriesNameFormat: ''
      operators_available:
        kind: Panel
        spec:
          display:
            name: Available
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: background_solid
              format:
                unit: decimal
              thresholds:
                defaultColor: '#73bf69'
                steps: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(cluster_operator_conditions{cluster="$cluster",condition="Available"} == 1) or vector(0)
                  seriesNameFormat: ''
      operators_not_available:
        kind: Panel
        spec:
          display:
            name: Not available
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: background_solid
              format:
                unit: decimal
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#f2495c'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(cluster_operator_conditions{cluster="$cluster",condition="Available"} == 0) or vector(0)
                  seriesNameFormat: ''
      operators_degraded_count:
        kind: Panel
        spec:
          display:
            name: Degraded
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: background_solid
              format:
                unit: decimal
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#f2495c'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(cluster_operator_conditions{cluster="$cluster",condition="Degraded"} == 1) or vector(0)
                  seriesNameFormat: ''
      operators_progressing:
        kind: Panel
        spec:
          display:
            name: Progressing
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: background_solid
              format:
                unit: decimal
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#ff9830'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(cluster_operator_conditions{cluster="$cluster",condition="Progressing"} == 1) or vector(0)
                  seriesNameFormat: ''
      operators_not_upgradeable:
        kind: Panel
        spec:
          display:
            name: Not upgradeable
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: background_solid
              format:
                unit: decimal
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#ff9830'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(cluster_operator_conditions{cluster="$cluster",condition="Upgradeable"} == 0) or vector(0)
                  seriesNameFormat: ''
      etcd_members:
        kind: Panel
        spec:
          display:
            name: Members
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#f2495c'
                steps:
                - value: 3
                  color: '#73bf69'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(etcd_server_has_leader{cluster="$cluster"})
                  seriesNameFormat: ''
      etcd_leader:
        kind: Panel
        spec:
          display:
            name: Members with a leader
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#f2495c'
                steps:
                - value: 3
                  color: '#73bf69'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(etcd_server_has_leader{cluster="$cluster"})
                  seriesNameFormat: ''
      etcd_leader_changes:
        kind: Panel
        spec:
          display:
            name: Leader changes (1h)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#ff9830'
                - value: 4
                  color: '#f2495c'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(increase(etcd_server_leader_changes_seen_total{cluster="$cluster"}[1h]))
                  seriesNameFormat: ''
      etcd_failed_proposals:
        kind: Panel
        spec:
          display:
            name: Failed proposals ($interval)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#ff9830'
                - value: 10
                  color: '#f2495c'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(increase(etcd_server_proposals_failed_total{cluster="$cluster"}[$interval]))
                  seriesNameFormat: ''
      etcd_health_failures:
        kind: Panel
        spec:
          display:
            name: Health failures ($interval)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#ff9830'
                - value: 10
                  color: '#f2495c'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(increase(etcd_server_health_failures{cluster="$cluster"}[$interval]))
                  seriesNameFormat: ''
      etcd_quota:
        kind: Panel
        spec:
          display:
            name: DB size vs. quota
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: percent-decimal
              sparkline: {}
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 0.6
                  color: '#ff9830'
                - value: 0.8
                  color: '#f2495c'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max(etcd_mvcc_db_total_size_in_bytes{cluster="$cluster"}) / max(etcd_server_quota_backend_bytes{cluster="$cluster"})
                  seriesNameFormat: ''
      etcd_db_size:
        kind: Panel
        spec:
          display:
            name: etcd DB size
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: etcd_mvcc_db_total_size_in_bytes{cluster="$cluster"}
                  seriesNameFormat: size - {{pod}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: etcd_mvcc_db_total_size_in_use_in_bytes{cluster="$cluster"}
                  seriesNameFormat: in use - {{pod}}
      etcd_objects:
        kind: Panel
        spec:
          display:
            name: Top 10 object counts stored in etcd (by resource)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, max by (resource) (apiserver_storage_objects{cluster="$cluster"}))
                  seriesNameFormat: '{{resource}}'
      etcd_wal_fsync:
        kind: Panel
        spec:
          display:
            name: WAL fsync duration (p99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum by (le, pod) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{cluster="$cluster"}[$interval])))
                  seriesNameFormat: '{{pod}}'
      etcd_backend_commit:
        kind: Panel
        spec:
          display:
            name: Backend commit duration (p99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum by (le, pod) (rate(etcd_disk_backend_commit_duration_seconds_bucket{cluster="$cluster"}[$interval])))
                  seriesNameFormat: '{{pod}}'
      etcd_peer_rtt:
        kind: Panel
        spec:
          display:
            name: Peer round trip time (p99)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum by (le, instance) (rate(etcd_network_peer_round_trip_time_seconds_bucket{cluster="$cluster"}[$interval])))
                  seriesNameFormat: '{{instance}}'
      etcd_slow_apply:
        kind: Panel
        spec:
          display:
            name: Slow applies
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (pod) (rate(etcd_server_slow_apply_total{cluster="$cluster"}[$interval]))
                  seriesNameFormat: '{{pod}}'
      '5_3':
        kind: Panel
        spec:
          display:
            name: Number of nodes
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(kube_node_info{cluster="$cluster"})
                  seriesNameFormat: Number of nodes
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(kube_node_status_condition{cluster="$cluster",status="true"}) by (condition) > 0
                  seriesNameFormat: 'Node: {{ condition }}'
      '5_4':
        kind: Panel
        spec:
          display:
            name: Namespace count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(kube_namespace_status_phase{cluster="$cluster"}) by (phase) > 0
                  seriesNameFormat: '{{ phase }} namespaces'
      '5_6':
        kind: Panel
        spec:
          display:
            name: Secret & configmap count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(kube_secret_info{cluster="$cluster"})
                  seriesNameFormat: secrets
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(kube_configmap_info{cluster="$cluster"})
                  seriesNameFormat: Configmaps
      '5_7':
        kind: Panel
        spec:
          display:
            name: Deployment count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(kube_deployment_spec_replicas{cluster="$cluster"})
                  seriesNameFormat: Deployments
      '5_8':
        kind: Panel
        spec:
          display:
            name: Services count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(kube_service_info{cluster="$cluster"})
                  seriesNameFormat: Services
      '5_9':
        kind: Panel
        spec:
          display:
            name: Routes count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(openshift_route_info{cluster="$cluster"})
                  seriesNameFormat: Routes
      mon_prom_up:
        kind: Panel
        spec:
          display:
            name: Prometheus replicas up
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#f2495c'
                steps:
                - value: 1
                  color: '#ff9830'
                - value: 2
                  color: '#73bf69'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(up{cluster="$cluster",namespace="openshift-monitoring",job="prometheus-k8s"} == 1) or vector(0)
                  seriesNameFormat: ''
      mon_am_members:
        kind: Panel
        spec:
          display:
            name: Alertmanager cluster members
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#f2495c'
                steps:
                - value: 1
                  color: '#ff9830'
                - value: 2
                  color: '#73bf69'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max(alertmanager_cluster_members{cluster="$cluster",namespace="openshift-monitoring",job="alertmanager-main"})
                  seriesNameFormat: ''
      mon_targets_down:
        kind: Panel
        spec:
          display:
            name: Scrape targets down
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#73bf69'
                steps:
                - value: 1
                  color: '#ff9830'
                - value: 10
                  color: '#f2495c'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(up{cluster="$cluster"} == 0) or vector(0)
                  seriesNameFormat: ''
      mon_reload:
        kind: Panel
        spec:
          display:
            name: Prometheus config reload
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              sparkline: {}
              thresholds:
                defaultColor: '#f2495c'
                steps:
                - value: 1
                  color: '#73bf69'
              mappings:
              - kind: Value
                spec:
                  value: '0'
                  result:
                    value: FAILED
              - kind: Value
                spec:
                  value: '1'
                  result:
                    value: OK
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: min(prometheus_config_last_reload_successful{cluster="$cluster",namespace="openshift-monitoring",job="prometheus-k8s"})
                  seriesNameFormat: ''
      mon_head_series:
        kind: Panel
        spec:
          display:
            name: Prometheus head series
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: prometheus_tsdb_head_series{cluster="$cluster",namespace="openshift-monitoring",job="prometheus-k8s"}
                  seriesNameFormat: '{{pod}}'
      mon_ingest:
        kind: Panel
        spec:
          display:
            name: Prometheus samples ingested / s
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (pod) (rate(prometheus_tsdb_head_samples_appended_total{cluster="$cluster",namespace="openshift-monitoring",job="prometheus-k8s"}[$interval]))
                  seriesNameFormat: '{{pod}}'
      mon_prom_cpu:
        kind: Panel
        spec:
          display:
            name: Prometheus CPU
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (pod) (rate(container_cpu_usage_seconds_total{cluster="$cluster",namespace="openshift-monitoring",pod=~"prometheus-k8s-.*",container="prometheus"}[$interval])) * 100
                  seriesNameFormat: '{{pod}}'
      mon_prom_rss:
        kind: Panel
        spec:
          display:
            name: Prometheus memory (RSS)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (pod) (container_memory_rss{cluster="$cluster",namespace="openshift-monitoring",pod=~"prometheus-k8s-.*",container="prometheus"})
                  seriesNameFormat: '{{pod}}'
      mon_targets_down_by_job:
        kind: Panel
        spec:
          display:
            name: Scrape targets down (by job)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count by (job) (up{cluster="$cluster"} == 0)
                  seriesNameFormat: '{{job}}'
      mon_adapter_cpu:
        kind: Panel
        spec:
          display:
            name: metrics-server CPU
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(irate(container_cpu_usage_seconds_total{cluster="$cluster",pod=~"metrics-server-.*",namespace="openshift-monitoring"}[$interval])) by (pod,container) * 100
                  seriesNameFormat: '{{pod}}'
      mon_adapter_rss:
        kind: Panel
        spec:
          display:
            name: metrics-server memory (RSS)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(container_memory_rss{cluster="$cluster",pod=~"metrics-server-.*",namespace="openshift-monitoring"}) by (pod)
                  seriesNameFormat: '{{pod}}'
      operators_status:
        kind: Panel
        spec:
          display:
            name: Cluster operator status
          plugin:
            kind: Table
            spec:
              density: compact
              columnSettings:
              - header: Operator
                name: 'name #1'
                enableSorting: true
                sort: asc
                width: 300
              - hide: true
                name: 'name #2'
              - hide: true
                name: 'name #3'
              - cellSettings:
                - backgroundColor: '#73bf69'
                  condition:
                    kind: Value
                    spec:
                      value: '1'
                  text: Available
                - backgroundColor: '#f2495c'
                  condition:
                    kind: Value
                    spec:
                      value: '0'
                  text: Not available
                enableSorting: true
                header: Available
                name: 'value #1'
                width: 150
                align: center
              - cellSettings:
                - backgroundColor: '#ff9830'
                  condition:
                    kind: Value
                    spec:
                      value: '1'
                  text: Progressing
                - backgroundColor: '#73bf69'
                  condition:
                    kind: Value
                    spec:
                      value: '0'
                  text: 'No'
                enableSorting: true
                header: Progressing
                name: 'value #2'
                width: 150
                align: center
              - cellSettings:
                - backgroundColor: '#f2495c'
                  condition:
                    kind: Value
                    spec:
                      value: '1'
                  text: Degraded
                - backgroundColor: '#73bf69'
                  condition:
                    kind: Value
                    spec:
                      value: '0'
                  text: 'No'
                enableSorting: true
                header: Degraded
                name: 'value #3'
                width: 150
                align: center
              - hide: true
                name: timestamp
              transforms:
              - kind: JoinByColumnValue
                spec:
                  columns:
                  - 'name #1'
                  - 'name #2'
                  - 'name #3'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max by (name) (cluster_operator_conditions{cluster="$cluster",condition="Available",name!=""})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max by (name) (cluster_operator_conditions{cluster="$cluster",condition="Progressing",name!=""})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max by (name) (cluster_operator_conditions{cluster="$cluster",condition="Degraded",name!=""})
      operators_changes:
        kind: Panel
        spec:
          display:
            name: Degraded / progressing operators over time
          plugin:
            kind: StatusHistoryChart
            spec:
              legend:
                position: bottom
              sorting: asc
              mappings:
              - kind: Value
                spec:
                  value: '1'
                  result:
                    value: Progressing
                    color: '#ff9830'
              - kind: Value
                spec:
                  value: '2'
                  result:
                    value: Degraded
                    color: '#f2495c'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: (cluster_operator_conditions{cluster="$cluster",condition="Degraded",name!=""} == 1) * 2
                  seriesNameFormat: '{{name}} - Degraded'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: cluster_operator_conditions{cluster="$cluster",condition="Progressing",name!=""} == 1
                  seriesNameFormat: '{{name}} - Progressing'
    layouts:
    - kind: Grid
      spec:
        display:
          title: Cluster Overview
          collapse:
            open: true
        items:
        - x: 0
          "y": 0
          width: 24
          height: 6
          content:
            $ref: '#/spec/panels/overview_alerts_stat'
        - x: 0
          "y": 6
          width: 12
          height: 9
          content:
            $ref: '#/spec/panels/overview_summary'
        - x: 12
          "y": 6
          width: 12
          height: 9
          content:
            $ref: '#/spec/panels/overview_alerts'
    - kind: Grid
      spec:
        display:
          title: Cluster Operators
          collapse:
            open: true
        items:
        - x: 0
          "y": 0
          width: 4
          height: 5
          content:
            $ref: '#/spec/panels/operators_total'
