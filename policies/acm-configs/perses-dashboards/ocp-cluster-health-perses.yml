        - x: 12
          "y": 0
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/etcd_failed_proposals'
        - x: 16
          "y": 0
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/etcd_health_failures'
        - x: 20
          "y": 0
          width: 4
          height: 4
          content:
