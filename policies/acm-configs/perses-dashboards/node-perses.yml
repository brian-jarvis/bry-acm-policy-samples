            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(container_last_seen{cluster="$cluster"}) by (node)
                  seriesNameFormat: Containers on {{node}}
      '3_0':
        kind: Panel
        spec:
          display:
            name: Top 10 Container Memory Working Set
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, container_memory_working_set_bytes{cluster="$cluster",namespace!="",container!="POD",name!=""})
                  seriesNameFormat: '{{ namespace }} - {{ name }}'
      '3_1':
        kind: Panel
        spec:
          display:
            name: Top 10 Container CPU(% of 1 core)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10,irate(container_cpu_usage_seconds_total{cluster="$cluster",namespace!="",container!="POD",name!=""}[$interval])*100)
                  seriesNameFormat: '{{ namespace }} - {{ name }}'
      '3_2':
        kind: Panel
        spec:
          display:
            name: Top 10 Goroutines count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: topk(10, sum(go_goroutines{cluster="$cluster"}) by (job,instance))
                  seriesNameFormat: '{{ job }} - {{ instance }}'
      '4_0':
        kind: Panel
        spec:
          display:
            name: Workers Kubelet Runtime Operations Errors/second, >0.001 Waning, >0.01 Critical, >0.1 Severe
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node, operation_type) (rate(kubelet_runtime_operations_errors_total{cluster="$cluster"} [$interval])  *  on (node) group_left kube_node_role{cluster="$cluster", role = "worker" })
                  seriesNameFormat: '{{node}}: {{operation_type}}'
      '4_1':
        kind: Panel
        spec:
          display:
            name: Control Plane Kubelet Runtime Operations Errors/second, >0.001 Waning, >0.01 Critical, >0.1 Severe
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node, operation_type) (rate(kubelet_runtime_operations_errors_total{cluster="$cluster"} [$interval]) *  on (node) group_left kube_node_role{cluster="$cluster", role = "control-plane" })
                  seriesNameFormat: '{{node}}: {{operation_type}}'
      '5_0':
        kind: Panel
        spec:
          display:
            name: P99 Kubelet Croup Manager Duration - Create
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(rate(kubelet_cgroup_manager_duration_seconds_bucket{cluster="$cluster",node=~".*",operation_type="create"}[5m])) by (node, operation_type, le)
                  seriesNameFormat: '{{node}}: {{operation_type}}'
      '5_1':
        kind: Panel
        spec:
          display:
            name: p99KubeletCroupManagerDuration - Update
          plugin:
            kind: TimeSeriesChart
            spec:
