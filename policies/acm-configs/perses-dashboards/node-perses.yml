---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  namespace: open-cluster-management-observability
  name: node-performance
  labels:
    managed-by: bry-tam-policies
spec:
  config:
    display:
      name: Node Performance
    variables:
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: cluster
        name: cluster
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
            labelName: name
            matchers:
            - acm_managed_cluster_labels{openshiftVersion_major!="3"}
    - kind: ListVariable
      spec:
        display:
          name: Namespace
          hidden: false
        allowAllValue: true
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            matchers:
            - kube_pod_info{cluster="$cluster",namespace!="(cluster-density.*|node-density-.*)"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: namespace
    - kind: ListVariable
      spec:
        display:
          name: interval
          hidden: false
        defaultValue: 10m
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - 1m
            - 3m
            - 5m
            - 10m
            - 20m
            - 30m
        name: interval
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: Workers CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( rate( (node_cpu_seconds_total{cluster="$cluster", mode != "idle" } * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:] ) ) by (instance) * 100
                  seriesNameFormat: '{{instance}}'
      '0_1':
        kind: Panel
        spec:
          display:
            name: Control Plane CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( rate( (node_cpu_seconds_total{cluster="$cluster", mode != "idle" } * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:] ) ) by (instance) * 100
                  seriesNameFormat: '{{instance}}'
      '0_2':
        kind: Panel
        spec:
          display:
            name: Workers Load1
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: 'node_load1{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker"} , "instance" , "$1" , "node" ,"(.*)") '
                  seriesNameFormat: '{{instance}}'
      '0_3':
        kind: Panel
        spec:
          display:
            name: Control Plane Load1
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: 'node_load1{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane"} , "instance" , "$1" , "node" ,"(.*)") '
                  seriesNameFormat: '{{instance}}'
      '0_4':
        kind: Panel
        spec:
          display:
            name: Workers Memory Available
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: node_memory_MemAvailable_bytes{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker"} , "instance" , "$1" , "node" ,"(.*)")
                  seriesNameFormat: '{{instance}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( node_memory_MemAvailable_bytes{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker"} , "instance" , "$1" , "node" ,"(.*)") )
                  seriesNameFormat: sum
      '0_5':
        kind: Panel
        spec:
          display:
            name: Control Plane Memory Available
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: node_memory_MemAvailable_bytes{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane"} , "instance" , "$1" , "node" ,"(.*)")
                  seriesNameFormat: '{{instance}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( node_memory_MemAvailable_bytes{cluster="$cluster"} * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane"} , "instance" , "$1" , "node" ,"(.*)") )
                  seriesNameFormat: sum
      '0_6':
        kind: Panel
        spec:
          display:
            name: Workers Disk IOPS
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: rate( (  node_disk_reads_completed_total{cluster="$cluster"} *  on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker" } , "instance" , "$1" , "node" ,"(.*)") )[$interval:])
                  seriesNameFormat: '{{instance}} - {{ device }} - read'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: rate( (  node_disk_writes_completed_total{cluster="$cluster"} *  on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker" } , "instance" , "$1" , "node" ,"(.*)") )[$interval:])
                  seriesNameFormat: '{{instance}} - {{ device }} - write'
      '0_7':
        kind: Panel
        spec:
          display:
            name: Control Plane Disk IOPS
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: rate( (  node_disk_reads_completed_total{cluster="$cluster"} *  on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane" } , "instance" , "$1" , "node" ,"(.*)") )[$interval:])
                  seriesNameFormat: '{{instance}} - {{ device }} - read'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: rate( (  node_disk_writes_completed_total{cluster="$cluster"} *  on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane" } , "instance" , "$1" , "node" ,"(.*)") )[$interval:])
                  seriesNameFormat: '{{instance}} - {{ device }} - write'
      "0_8":
        kind: Panel
        spec:
          display:
            name: Workers Container Threads
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node) (container_threads{cluster="$cluster", container!=""})  * on (node) group_left kube_node_role{cluster="$cluster", role = "worker" }
                  seriesNameFormat: '{{instance}}'
      "0_9":
        kind: Panel
        spec:
          display:
            name: Control Plane Container Threads
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node) (container_threads{cluster="$cluster", container!=""})  * on (node) group_left kube_node_role{cluster="$cluster", role = "control-plane" }
                  seriesNameFormat: '{{instance}}'
      '1_0':
        kind: Panel
        spec:
          display:
            name: Workers CGroup CPU(% of 1 core)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (id) (( rate(container_cpu_usage_seconds_total{cluster="$cluster", job=~".*", id =~"/system.slice|/system.slice/kubelet.service|/system.slice/ovs-vswitchd.service|/system.slice/crio.service|/system.slice/systemd-journald.service|/system.slice/ovsdb-server.service|/system.slice/systemd-udevd.service|/kubepods.slice"}[$interval])) * 100 * on (node) group_left kube_node_role{cluster="$cluster", role = "worker" } )
                  seriesNameFormat: '{{instance}}'
      '1_1':
        kind: Panel
        spec:
          display:
            name: Control Plane CGroup CPU(% of 1 core)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (id) (( rate(container_cpu_usage_seconds_total{cluster="$cluster", job=~".*", id =~"/system.slice|/system.slice/kubelet.service|/system.slice/ovs-vswitchd.service|/system.slice/crio.service|/system.slice/systemd-journald.service|/system.slice/ovsdb-server.service|/system.slice/systemd-udevd.service|/kubepods.slice"}[$interval])) * 100 * on (node) group_left kube_node_role{cluster="$cluster", role = "control-plane" } )
                  seriesNameFormat: '{{instance}}'
      '1_2':
        kind: Panel
        spec:
          display:
            name: Workers CGroup Memory Working Set
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (id) (container_memory_working_set_bytes{cluster="$cluster", job=~".*", id =~"/system.slice|/system.slice/kubelet.service|/system.slice/ovs-vswitchd.service|/system.slice/crio.service|/system.slice/systemd-journald.service|/system.slice/ovsdb-server.service|/system.slice/systemd-udevd.service|/kubepods.slice"} * on (node) group_left kube_node_role{cluster="$cluster", role = "worker" } )
                  seriesNameFormat: '{{instance}}'
      '1_3':
        kind: Panel
        spec:
          display:
            name: Control Plane CGroup Memory Working Set
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (id) (container_memory_working_set_bytes{cluster="$cluster", job=~".*", id =~"/system.slice|/system.slice/kubelet.service|/system.slice/ovs-vswitchd.service|/system.slice/crio.service|/system.slice/systemd-journald.service|/system.slice/ovsdb-server.service|/system.slice/systemd-udevd.service|/kubepods.slice"} * on (node) group_left kube_node_role{cluster="$cluster", role = "control-plane" } )
                  seriesNameFormat: '{{instance}}'
      '1_4':
        kind: Panel
        spec:
          display:
            name: system.slice Working Set by node
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node)(container_memory_working_set_bytes{cluster="$cluster",id="/system.slice"})
                  seriesNameFormat: system.slice - {{ node }}
      '1_5':
        kind: Panel
        spec:
          display:
            name: system.slice CPU by node
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum by (node) (( rate(container_cpu_usage_seconds_total{cluster="$cluster",id="/system.slice"}[$interval])) * 100)
                  seriesNameFormat: system.slice - {{ node }}
      '2_0':
        kind: Panel
        spec:
          display:
            name: Pod count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(kube_pod_status_phase{cluster="$cluster"}) by (phase)
                  seriesNameFormat: '{{phase}} pods'
      '2_1':
        kind: Panel
        spec:
          display:
            name: Pod Distribution
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(kube_pod_info{cluster="$cluster"}) by (node)
                  seriesNameFormat: '{{ node }}'
      '2_2':
        kind: Panel
        spec:
          display:
            name: Container count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: count(kube_pod_container_info{cluster="$cluster"})
                  seriesNameFormat: Containers
      '2_3':
        kind: Panel
        spec:
          display:
            name: Container Distribution
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
