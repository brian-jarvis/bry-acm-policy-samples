                  query: delta(etcd_server_slow_apply_total{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}[2m])
                  seriesNameFormat: '{{ pod }} slow applies'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: delta(etcd_server_slow_read_indexes_total{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}[2m])
                  seriesNameFormat: '{{ pod }} slow read indexes'
      '6_7':
        kind: Panel
        spec:
          display:
            name: Key Operations
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
