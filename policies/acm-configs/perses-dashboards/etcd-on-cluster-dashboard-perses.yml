                  query: changes(etcd_server_leader_changes_seen_total{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}[1d])
                  seriesNameFormat: '{{instance}} Total Leader Elections Per Day'
      '6_6':
        kind: Panel
        spec:
          display:
            name: Slow Operations
