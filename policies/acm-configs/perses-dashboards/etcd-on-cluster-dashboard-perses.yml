                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: etcd_disk_backend_defrag_duration_seconds_sum{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}
                  seriesNameFormat: 'defrag sum {{instance}} '
      '1_2':
        kind: Panel
        spec:
          display:
