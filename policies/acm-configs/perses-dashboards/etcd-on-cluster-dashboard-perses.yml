---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  namespace: open-cluster-management-observability
  name: etcd-on-cluster-dashboard
  labels:
    managed-by: bry-tam-policies
spec:
  config:
    display:
      name: etcd-cluster-info dashboard
    variables:
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: cluster
        name: cluster
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
            labelName: name
            matchers:
            - acm_managed_cluster_labels{openshiftVersion_major!="3"}
    - kind: ListVariable
      spec:
        display:
          hidden: false
        allowAllValue: true
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
            - etcd_cluster_version{cluster="$cluster"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: etcd_pod
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: CPU usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(irate(container_cpu_usage_seconds_total{cluster="$cluster",namespace="openshift-etcd", container="etcd",pod=~"$etcd_pod"}[2m])) by (pod) * 100
                  seriesNameFormat: '{{ pod }}'
      '0_1':
        kind: Panel
        spec:
          display:
            name: Memory usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(avg_over_time(container_memory_working_set_bytes{cluster="$cluster",container="",pod!="", namespace=~"openshift-etcd.*",pod=~"$etcd_pod"}[2m])) BY (pod, namespace)
                  seriesNameFormat: '{{ pod }}'
      '0_2':
        kind: Panel
        spec:
          display:
            name: Disk WAL Sync Duration
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}[5m])) by (pod, le))
                  seriesNameFormat: '{{pod}} WAL fsync'
      '0_3':
        kind: Panel
        spec:
          display:
            name: Disk Backend Sync Duration
          plugin:
            kind: TimeSeriesChart
            spec:
