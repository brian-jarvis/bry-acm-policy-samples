                  query: (etcd_mvcc_db_total_size_in_bytes{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"} / etcd_server_quota_backend_bytes{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"})*100
                  seriesNameFormat: '{{pod}}'
      '5_1':
        kind: Panel
        spec:
          display:
            name: DB Left capacity (with fragmented space)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: etcd_server_quota_backend_bytes{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"} - etcd_mvcc_db_total_size_in_bytes{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}
                  seriesNameFormat: '{{pod}}'
      '5_2':
        kind: Panel
        spec:
          display:
            name: DB Size Limit (Backend-bytes)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: etcd_server_quota_backend_bytes{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}
                  seriesNameFormat: '{{ pod }} Quota Bytes'
      '6_0':
        kind: Panel
        spec:
          display:
            name: Raft Proposals
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(rate(etcd_server_proposals_failed_total{cluster="$cluster",namespace="openshift-etcd"}[2m]))
                  seriesNameFormat: Proposal Failure Rate
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(etcd_server_proposals_pending{cluster="$cluster",namespace="openshift-etcd"})
                  seriesNameFormat: Proposal Pending Total
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(rate(etcd_server_proposals_committed_total{cluster="$cluster",namespace="openshift-etcd"}[2m]))
                  seriesNameFormat: Proposal Commit Rate
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(rate(etcd_server_proposals_applied_total{cluster="$cluster",namespace="openshift-etcd"}[2m]))
                  seriesNameFormat: Proposal Apply Rate
      '6_1':
        kind: Panel
        spec:
          display:
            name: Number of leader changes seen
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum(rate(etcd_server_leader_changes_seen_total{cluster="$cluster",namespace="openshift-etcd"}[2m]))
                  seriesNameFormat: ''
      '6_2':
        kind: Panel
        spec:
          display:
            name: Etcd has a leader?
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Value
                spec:
                  result:
                    value: 'NO'
                  value: '0'
              - kind: Value
                spec:
                  result:
                    value: 'YES'
                  value: '1'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max(etcd_server_has_leader{cluster="$cluster",namespace="openshift-etcd"})
                  seriesNameFormat: ''
      '6_3':
        kind: Panel
        spec:
          display:
            name: Total number of failed proposals seen
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: max(etcd_server_proposals_committed_total{cluster="$cluster",namespace="openshift-etcd"})
                  seriesNameFormat: ''
      '6_4':
        kind: Panel
        spec:
          display:
            name: Keys
