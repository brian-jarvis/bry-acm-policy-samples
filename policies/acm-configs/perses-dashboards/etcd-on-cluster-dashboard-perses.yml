                  query: rate(etcd_mvcc_delete_total{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}[2m])
                  seriesNameFormat: '{{ pod }} deletes/s'
      '6_8':
        kind: Panel
        spec:
          display:
            name: Heartbeat Failures
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
