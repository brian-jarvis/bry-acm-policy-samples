                  seriesNameFormat: '{{pod}} DB physical size'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: etcd_mvcc_db_total_size_in_use_in_bytes{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}
                  seriesNameFormat: '{{pod}} DB logical size'
      '1_0':
        kind: Panel
        spec:
          display:
            name: Compaction Duration sum
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - first
                - min
                - max
                - last
              querySettings:
              - format:
                  unit: decimal
                queryIndex: 0
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
