                  unit: decimal
                label: sum
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: delta(etcd_debugging_mvcc_db_compaction_total_duration_milliseconds_sum{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}[1m:30s])/2
                  seriesNameFormat: 'rate compact sum {{instance}} '
          - kind: TimeSeriesQuery
            spec:
              plugin:
