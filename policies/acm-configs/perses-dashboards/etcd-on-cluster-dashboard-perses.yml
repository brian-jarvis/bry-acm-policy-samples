            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: etcd_debugging_mvcc_keys_total{cluster="$cluster",namespace="openshift-etcd",pod=~"$etcd_pod"}
                  seriesNameFormat: '{{ pod }} Num keys'
      '6_5':
        kind: Panel
        spec:
          display:
            name: Leader Elections Per Day
