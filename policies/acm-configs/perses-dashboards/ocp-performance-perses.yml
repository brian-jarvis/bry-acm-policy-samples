---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  namespace: open-cluster-management-observability
  name: ocp-performance
  labels:
    managed-by: bry-tam-policies
spec:
  config:
    display:
      name: Openshift Performance
    variables:
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: cluster
        name: cluster
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
            labelName: name
            matchers:
            - acm_managed_cluster_labels{openshiftVersion_major!="3"}
    - kind: ListVariable
      spec:
        display:
          name: Master
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: node
            matchers:
            - kube_node_role{cluster="$cluster",role="master"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: _master_node
    - kind: ListVariable
      spec:
        display:
          name: Worker
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: node
            matchers:
            - kube_node_role{cluster="$cluster",role=~"worker"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: _worker_node
    - kind: ListVariable
      spec:
        display:
          name: Infra
          hidden: false
        allowAllValue: false
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: node
            matchers:
            - kube_node_role{cluster="$cluster",role="infra"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: _infra_node
    - kind: ListVariable
      spec:
        display:
          name: Namespace
          hidden: false
        allowAllValue: true
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            matchers:
            - kube_pod_info{cluster="$cluster",namespace!~"(cluster-density.*|node-density-.*)"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: namespace
    - kind: ListVariable
      spec:
        display:
          name: Block device
          hidden: false
        allowAllValue: true
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: device
            matchers:
            - node_disk_written_bytes_total{cluster="$cluster"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: block_device
    - kind: ListVariable
      spec:
        display:
          name: Network device
          hidden: false
        allowAllValue: true
        allowMultiple: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: device
            matchers:
            - node_network_receive_bytes_total{cluster="$cluster"}
            datasource:
              kind: PrometheusDatasource
              name: rbac-query-proxy-datasource
        name: net_device
    - kind: ListVariable
      spec:
        display:
          name: interval
          hidden: false
        defaultValue: 10m
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - 1m
            - 3m
            - 5m
            - 10m
            - 20m
            - 30m
        name: interval
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: Workers CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( rate( (node_cpu_seconds_total{cluster="$cluster", mode != "idle" } * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "worker"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:] ) ) by (instance) * 100
                  seriesNameFormat: '{{instance}}'
      '0_1':
        kind: Panel
        spec:
          display:
            name: Control Plane CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - min
                - max
              visual:
                connectNulls: false
              yAxis:
                format:
                  unit: percent
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: rbac-query-proxy-datasource
                  query: sum( rate( (node_cpu_seconds_total{cluster="$cluster", mode != "idle" } * on (instance) group_left label_replace( kube_node_role{cluster="$cluster", role = "control-plane"} , "instance" , "$1" , "node" ,"(.*)") )[$interval:] ) ) by (instance) * 100
                  seriesNameFormat: '{{instance}}'
      '0_2':
