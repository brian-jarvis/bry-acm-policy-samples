---
object-templates-raw: |
  {{- $deplyConfig := `
    group: addon.open-cluster-management.io
    name: clusteraddon-resource-config
    namespace: open-cluster-management-hub
    resource: addondeploymentconfigs
  ` }}
  {{- range $cma := (lookup "addon.open-cluster-management.io/v1beta1" "ClusterManagementAddOn" "" "").items }}
    {{- if eq $cma.metadata.name "governance-policy-framework" "config-policy-controller" }}
      {{- $_ := set $cma.spec "defaultConfigs" list }}
      {{- $_ := set $cma.spec "defaultConfigs" (append $cma.spec.defaultConfigs ($deplyConfig | fromYaml)) }}

  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: addon.open-cluster-management.io/v1beta1
      kind: ClusterManagementAddOn
      metadata:
        name: {{ $cma.metadata.name }}
      spec: '{{ $cma.spec | toRawJson | toLiteral }}'
    {{- end }}
  {{- end }}
